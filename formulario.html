<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
</head>
<body>
    <center>
    <h2>Meu primeiro formulario</h2>
    <form action="Obrigado.html" method="post">
        <label for="name">Nome: </label>
        <input type="text" name="name" placeholder="Digite seu nome " required><br>
        <label for="email">Email</label>
        <input type="email" name="email" placeholder="Digite seu email" required><br>
        <label for="senha">Senha</label>
        <input type="password" name="senha" placeholder="Digite sua senha" required><br>
        <label for="Carros">Escolha o seu carro</label>
        <select name="carro" id="">
            <option name="Fusca">Fusca</option>
            <option name="Celta">Celta</option>
            <option name="Uno" selected>Uno</option>
        </select><br>
        <label for="msg">Digite uma Mensasgem</label><br>
        <textarea name="msg" id="" cols=""></textarea>
        <button type="submit">Enviar</button>

        
    </form>    
</body>
</html>
